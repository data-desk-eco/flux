name: DNS

# one-off, run by hand: point flux.datadesk.eco at github pages the way
# research.datadesk.eco already is. idempotent — a rerun updates in place — so
# it is safe to repeat, and safe to delete once the record exists.
on: workflow_dispatch

jobs:
  cname:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NAME: flux.datadesk.eco
      TARGET: data-desk-eco.github.io
    steps:
      - name: Ensure the CNAME
        run: |
          api() { curl -sf -H "Authorization: Bearer $CF" -H 'Content-Type: application/json' "$@"; }
          base=https://api.cloudflare.com/client/v4
          zone=$(api "$base/zones?name=datadesk.eco" | jq -r '.result[0].id // empty')
          [ -n "$zone" ] || { echo "no zone named datadesk.eco on this token"; exit 1; }
          rec=$(api "$base/zones/$zone/dns_records?type=CNAME&name=$NAME" | jq -r '.result[0].id // empty')
          body="{\"type\":\"CNAME\",\"name\":\"$NAME\",\"content\":\"$TARGET\",\"proxied\":true}"
          if [ -n "$rec" ]; then
            api -X PUT "$base/zones/$zone/dns_records/$rec" -d "$body" > /dev/null
          else
            api -X POST "$base/zones/$zone/dns_records" -d "$body" > /dev/null
          fi
          echo "CNAME $NAME -> $TARGET (proxied)"
